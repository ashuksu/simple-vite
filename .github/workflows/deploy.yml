name: Deploy static content (Simple Vite) to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies (node modules)
        run: npm ci

      - name: ESLinter
        run: npm run lint

      - name: Build Project
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          BASE_PATH: "/simple-vite/"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5